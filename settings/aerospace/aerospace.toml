###########
# General #
###########

config-version = 2
start-at-login = true

# Tile windows by default.
default-root-container-layout = 'tiles'

# Side-by-side layout on normal widescreen displays.
default-root-container-orientation = 'auto'

# Auto center the mouse pointer at the window being focused
on-focus-changed = ['move-mouse window-lazy-center']

############
# Monitors #
############

# Set external monitor (main) as primary display
[workspace-to-monitor-force-assignment]
1 = ['main', 'built-in']
2 = ['main', 'built-in']
3 = ['main', 'built-in']
4 = ['main', 'built-in']
5 = ['main', 'built-in']
6 = ['main', 'built-in']
7 = ['main', 'built-in']
8 = ['main', 'built-in']
9 = ['main', 'built-in']

########
# Gaps #
########

# 2px gap between tiled windows.
[gaps]
inner.horizontal = 0
inner.vertical = 1
outer.left = 0
outer.right = 0
outer.top = 0
outer.bottom = 0

################
# Window Rules #
################

# [[on-window-detected]]
# if.app-id = 'com.mitchellh.ghostty'
# run = 'exec-and-forget ~/.config/aerospace/move-window.sh Ghostty'
#
# [[on-window-detected]]
# if.app-id = 'org.chromium.Chromium'
# run = 'exec-and-forget ~/.config/aerospace/move-window.sh Chromium'
#
# [[on-window-detected]]
# if.app-id = 'com.apple.finder'
# run = 'exec-and-forget ~/.config/aerospace/move-window.sh Finder'
#
# [[on-window-detected]]
# if.app-id = 'com.apple.music'
# run = 'exec-and-forget ~/.config/aerospace/move-window.sh Music'

[[on-window-detected]]
if.app-id = "com.valvesoftware.steam"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.libretro.dist.RetroArch"
run = "layout floating"

# Reload config using Cmd + Ctrl + -
[mode.main.binding]
alt-h = 'focus left'
alt-l = 'focus right'
cmd-ctrl-minus = 'reload-config'

##########################
# Keybindings - Vertical #
##########################

# Chromium
cmd-1 = [
  'workspace 1',
  'layout v_tiles',
  'exec-and-forget open -a Chromium',
  'move-node-to-workspace 1',
]

# Ghostty
cmd-2 = [
  'workspace 1',
  'layout v_tiles',
  'exec-and-forget open -a Ghostty',
  'move-node-to-workspace 1',
]

# Finder
cmd-3 = [
  'workspace 2',
  'layout v_tiles',
  'exec-and-forget open -a Finder',
  'move-node-to-workspace 2',
]

# Music
cmd-4 = [
  'workspace 2',
  'layout v_tiles',
  'exec-and-forget open -a Music',
  'move-node-to-workspace 2'
]

# Organize
cmd-minus = [
  'workspace 1',
  'layout v_tiles',
  'focus --dfs-index 0',
  'resize height 880'
]

############################
# Keybindings - Horizontal #
############################

# Chromium
cmd-alt-1 = [
  'workspace 1',
  'layout h_tiles',
  'exec-and-forget open -a Chromium',
  'move-node-to-workspace 1'
]

# Ghostty
cmd-alt-2 = [
  'workspace 2',
  'layout h_tiles',
  'exec-and-forget open -a Ghostty',
  'move-node-to-workspace 2'
]

# Finder
cmd-alt-3 = [
  'workspace 3',
  'layout h_tiles',
  'exec-and-forget open -a Finder',
  'move-node-to-workspace 3'
]

# Music
cmd-alt-4 = [
  'workspace 4',
  'layout h_tiles',
  'exec-and-forget open -a Music',
  'move-node-to-workspace 4'
]
